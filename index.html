<style>
/* Layout: one-column phone app — sticky header, "today" action queue first, then all tickets; bottom tab bar.
   Design carried over unchanged from reference/lot-reports.html (stage 2). */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f6f7f8; --fg:#1b2026; --muted:#5e6873; --line:#d9dde2;
  --accent:#1f5f8b; --accent-fg:#ffffff;
  --plate:#f7c81e; --plate-ink:#111111; --plate-edge:#1b2026;
  --red:#c62828; --red-bg:#fde8e8; --amber:#a35c00; --amber-bg:#fff1d6; --green:#1e7a3c; --green-bg:#e3f4e8; --grey-bg:#e7e9ec;
  --wa:#1d8a4e;
  --f-display:"Rubik",system-ui,sans-serif; --f-body:"Assistant",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161a; --surface:#1b2126; --surface-2:#222930; --fg:#e8ecef; --muted:#9aa5b0; --line:#323b44;
  --accent:#6fb3e3; --accent-fg:#0d1a24; --plate:#e9bb12; --plate-ink:#111; --plate-edge:#000;
  --red:#ff7b7b; --red-bg:#3a1c1c; --amber:#ffb84d; --amber-bg:#3a2a12; --green:#6fd38f; --green-bg:#16301f; --grey-bg:#2a3138; --wa:#3ccf7d;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:4px 14px}
.stat{background:var(--surface);border-radius:var(--r);padding:10px;border:1px solid var(--line);min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--red)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;border-inline-start:5px solid var(--line)}
.card.s-red,.card.s-late{border-inline-start-color:var(--red)}
.card.s-r3,.card.s-r5{border-inline-start-color:var(--amber)}
.card.s-paid{border-inline-start-color:var(--green)}
.card.s-dispute,.card.s-ours{border-inline-start-color:var(--muted)}
.card.s-review{border-inline-start-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--plate-edge);border-radius:6px;overflow:hidden;background:var(--plate);color:var(--plate-ink);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;direction:ltr;font-variant-numeric:tabular-nums}
.plate i{font-style:normal;background:#1c4fa8;color:#fff;font-size:9px;line-height:1.1;padding:3px 4px;display:flex;flex-direction:column;justify-content:center;text-align:center;letter-spacing:0}
.plate span{padding:2px 8px}
.who{font-weight:700;font-size:16px;min-width:0}
.meta{color:var(--muted);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-red,.p-late{background:var(--red-bg);color:var(--red)}
.p-r3,.p-r5{background:var(--amber-bg);color:var(--amber)}
.p-paid{background:var(--green-bg);color:var(--green)}
.p-new,.p-wait,.p-dispute,.p-ours{background:var(--grey-bg);color:var(--muted)}
.p-review{background:var(--accent);color:var(--accent-fg)}
.p-other{background:var(--grey-bg);color:var(--fg)}
.p-blate{background:var(--red-bg);color:var(--red)}
.card.s-blate{border-inline-start-color:var(--red)}
.card.s-other{border-inline-start-color:var(--accent)}
.binder{font-family:var(--f-display);font-weight:700;font-size:14px;padding:3px 10px;border-radius:6px;border:2px dashed var(--muted);color:var(--fg)}
.sample{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--grey-bg);color:var(--muted)}
.days{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:14px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.note.red{background:var(--red-bg);color:var(--red);font-weight:600}
.note.amber{background:var(--amber-bg);color:var(--amber);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.tabs{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;padding:6px 10px;font-weight:700;font-size:14px;color:var(--muted);border-radius:8px;min-width:64px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface-2)}
nav.tabs .add{background:var(--accent);color:var(--accent-fg)!important}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:14px;font-weight:700}
.field small{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type="date"]{direction:rtl}
textarea{min-height:90px;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.match{border-radius:10px;padding:10px 12px;font-size:15px}
.match.ok{background:var(--green-bg);color:var(--green)}
.match.miss{background:var(--amber-bg);color:var(--amber)}
.match.warn{background:var(--red-bg);color:var(--red)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:680px;border-radius:16px 16px 0 0;max-height:88%;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:15px;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30}
.search{margin-bottom:10px}
.issuer{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.issuer:last-child{border-bottom:0}
.ltr{direction:ltr;text-align:right}
.sum5{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.sum5{grid-template-columns:repeat(2,1fr)}.sum5 .stat:last-child{grid-column:1/-1}}
.dtab{width:100%;border-collapse:collapse;font-size:15px}
.dtab th{text-align:start;font-size:13px;color:var(--muted);font-weight:700;padding:8px 4px;border-bottom:1px solid var(--line)}
.dtab td{padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.dtab tr:last-child td{border-bottom:0}
.dtab tbody tr{cursor:pointer}
.dtab tbody tr:hover td,.dtab tbody tr:focus td{background:var(--surface-2)}
.dtab td:nth-child(2),.dtab th:nth-child(2){text-align:center}
.dtab td:nth-child(3),.dtab th:nth-child(3){text-align:end;font-weight:700}
.status-line{font-size:13px;color:var(--muted);margin-top:4px}
.checkbar{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:10px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--red);background:var(--red-bg);color:var(--red);font-weight:700;font-size:16px;text-align:start}
.checkbar b{font-family:var(--f-display);font-size:22px}
.checkbar span{margin-inline-start:auto;font-size:14px}
.sheet input{margin-top:4px}
.login{max-width:420px;margin:12vh auto 0}
body.signed-out nav.tabs,body.signed-out #exportBtn{display:none}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body class="signed-out">
<div class="wrap">
<header>
  <div><h1>דוחות מגרש</h1><div class="sub" id="today"></div></div>
  <button class="btn small ghost" id="exportBtn" type="button">ייצוא לגיליון</button>
</header>
<main id="view"><div class="empty">טוען…</div></main>
<div class="status-line" id="conn"></div>
</div>

<nav class="tabs" aria-label="ניווט">
  <button data-tab="today" aria-current="page" type="button">היום</button>
  <button data-tab="all" type="button">כל הדוחות</button>
  <button data-tab="add" class="add" type="button">+ דוח חדש</button>
  <button data-tab="summary" type="button">סיכום</button>
  <button data-tab="settings" type="button">הגדרות</button>
</nav>
<div id="sheetHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
// ---- connection (publishable key: safe in a web page; data is protected by sign-in rules in the database)
const SUPABASE_URL="https://rhyzmdstxpkoxhfsqhsm.supabase.co";
const SUPABASE_KEY="sb_publishable_hPWjaBq2iWJU2HPf1p4RKw_Qu1ODN_D";
const START_HASH=location.hash; // read before the client consumes invite/recovery links
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=86400000;
const state={tab:"today",filter:"open",q:"",customer:"",source:"",tickets:[],dealers:{},dealerByName:{},issuers:{},issuerByName:{},
  ready:false,user:null,mode:"login",editing:null,match:null,matchFor:"",busy:false};

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmt(iso){if(!iso)return"—";const [y,m,d]=iso.slice(0,10).split("-");return `${d}/${m}/${y}`}
function daysTo(iso){if(!iso)return null;return Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/DAY)}
function money(n){const v=Number(n);return isFinite(v)&&v?"₪"+v.toLocaleString("he-IL"):"—"}
function normPlate(p){return String(p||"").replace(/\D/g,"")}
function plateFmt(p){p=normPlate(p);if(p.length===7)return p.slice(0,2)+"-"+p.slice(2,5)+"-"+p.slice(5);if(p.length===8)return p.slice(0,3)+"-"+p.slice(3,5)+"-"+p.slice(5);return p}
function plateHTML(p){return `<span class="plate" aria-label="מספר רכב ${esc(p)}"><i>IL<br>ישראל</i><span>${esc(plateFmt(p))}</span></span>`}
function errText(e){return e&&(e.message||e.error_description||e.code)||String(e)}

// ---- data: load everything the screens need, mapped to the same ticket shape the stage-2 screens used
function fromRow(r){
  const sent={};(r.message_log||[]).forEach(m=>sent[m.kind]=m.sent_at);
  const delivered={};(r.deliveries||[]).forEach(m=>delivered[m.kind]=m.delivered_at);
  const sale=r.car_sales||{};
  return {id:r.id,plate:r.plate,model:sale.model||"",saleId:r.sale_id,saleDate:sale.sale_date||"",
    dealerId:r.dealer_id,dealer:(state.dealers[r.dealer_id]||{}).name||"",
    issuerId:r.issuer_id,issuer:(state.issuers[r.issuer_id]||{}).name||"",
    ticketNo:r.ticket_no||"",receiptNo:r.receipt_no||"",
    offenseDate:r.offense_at?r.offense_at.slice(0,10):"",offenseTime:r.offense_at?r.offense_at.slice(11,16):"",
    offensePlace:r.offense_place||"",noticeDate:r.notice_date||"",receivedDate:r.received_date||"",
    amount:r.amount,amountAfter:r.amount_after,dueDate:r.due_date||"",doubleDate:r.double_date||"",
    payLink:r.pay_link||"",status:r.status,notes:r.notes||"",isSample:r.is_sample,createdAt:r.created_at,closedAt:r.closed_at,sent,
    source:r.source,reviewNeeded:r.review_needed,emailFrom:r.email_from||"",emailSubject:r.email_subject||"",
    emailReceivedAt:r.email_received_at,fileUrl:r.file_url||"",extractRaw:r.extract_raw,
    delivered,reviewReason:r.review_reason||"",instCustomer:r.inst_customer||"",instSaleDate:r.inst_sale_date||"",
    binderRow:r.binder_row,binderName:r.binder_name||"",binderNote:r.binder_note||"",
    doubledAt:r.doubled_at,newDeadline:r.new_deadline||"",clientHandling:!!r.client_handling,lastAction:lastActionText(r.ticket_actions)};
}
const ACTION_NAME={paid:"שולם",doubled:"הוכפל",deadline:"עודכן מועד אחרון",transfer:"הוגשה הסבה",transferok:"הסבה התקבלה",transferno:"הסבה נדחתה",
  legal:"הועבר לטיפול משפטי",lotpaid:"שולם ע\"י מיליון",legaldone:"הטיפול המשפטי הסתיים",lotdone:"טופל",reopen:"נפתח מחדש"};
function lastActionText(list){
  if(!list||!list.length)return "";
  const a=list.slice().sort((x,y)=>(y.at||"").localeCompare(x.at||""))[0];
  const when=new Date(a.at);
  return `פעולה אחרונה: ${ACTION_NAME[a.action]||a.action} · ${fmt(a.at.slice(0,10))} ${when.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}${a.by_email?` · ${a.by_email}`:""}`;
}
async function load(){
  const [d,i]=await Promise.all([sb.from("dealers").select("id,name,phone").order("name"),sb.from("issuers").select("*").order("id")]);
  if(d.error)throw d.error;if(i.error)throw i.error;
  state.dealers={};state.dealerByName={};d.data.forEach(x=>{state.dealers[x.id]=x;state.dealerByName[x.name]=x});
  state.issuers={};state.issuerByName={};i.data.forEach(x=>{state.issuers[x.id]=x;state.issuerByName[x.name]=x});
  const t=await sb.from("tickets").select("*, message_log(kind,sent_at), deliveries(kind,delivered_at), car_sales(sale_date,model), ticket_actions(action,at,by_email)").order("created_at");
  if(t.error)throw t.error;
  state.tickets=t.data.map(fromRow);state.ready=true;
  $("#conn").textContent=`מחובר/ת: ${state.user.email} · ${state.tickets.length} דוחות`;
}
async function refresh(){
  if(!state.user)return;
  try{await load();if(!(state.tab==="add"||state.tab==="settings"||document.activeElement?.matches("input,textarea,select")||$("#sh")))render()}
  catch(e){$("#conn").textContent="אין חיבור למאגר: "+errText(e)}
}

// ---- who owned the car on the offense date: latest sale on or before it
async function findSale(plate,off){
  const {data,error}=await sb.from("car_sales").select("id,plate,model,sale_date,dealer_id").eq("plate",plate).order("sale_date");
  if(error)throw error;
  if(!data.length)return null;
  let pick=off?[...data].reverse().find(s=>s.sale_date<=off):data[data.length-1], before=false;
  if(!pick){pick=data[0];before=true}
  return {...pick,buyer:(state.dealers[pick.dealer_id]||{}).name||"",before,sales:data.length};
}
function dealerOf(t){return state.dealers[t.dealerId]||{name:t.dealer,phone:""}}

// ---- status flow (owner's design, 08/11/2026)
//   open -> deadline passes -> expired -> "paid" (archive) | "doubled" (back to open, doubled amount, no deadline)
//   doubled + "update deadline" -> normal again (reminders, expires again; no second "doubled")
//   "transfer submitted" (only before doubling) -> transfers -> accepted (archive) | rejected (open / expired)
//   legal -> "handling finished" (archive);  "paid by Million" -> "handled" (archive)
const ARCHIVE=["paid","done"];
function deadline(t){return t.doubledAt?t.newDeadline:(t.doubleDate||t.dueDate)}       // the date that counts now
function debt(t){return Number(t.doubledAt&&Number(t.amountAfter)?t.amountAfter:t.amount)||0}  // doubled -> amount after doubling
function tabOf(t){
  if(t.reviewNeeded)return "review";
  if(ARCHIVE.includes(t.status))return "archive";
  if(t.status==="legal")return "legal";
  if(t.status==="lot_paid")return "lotpaid";
  if(t.status==="pending_transfer"||t.status==="client_handling")return "transfer";
  if(t.status!=="open")return "none";                // dispute / the lot's: only under "all"
  const d=daysTo(deadline(t));
  return d!==null&&d<0?"expired":"open";
}
function transferLate(t){const d=daysTo(t.doubleDate||t.dueDate);return t.status==="pending_transfer"&&d!==null&&d<0}
function needsCheck(t){return tabOf(t)==="expired"||transferLate(t)}

// messages: same thresholds as due_kind() in the database
function stage(t){
  const tab=tabOf(t), sent=t.sent||{}, d=daysTo(deadline(t));
  if(tab==="review")return {k:"review",label:"לבדיקה",msg:null};
  if(tab==="archive")return {k:"paid",label:t.status==="done"?"טופל":"שולם",msg:null};
  if(tab==="legal")return {k:"other",label:"בטיפול משפטי",msg:null};
  if(tab==="lotpaid")return {k:"other",label:"שולם ע\"י מיליון",msg:null};
  if(tab==="transfer")return {k:transferLate(t)?"late":"other",label:t.status==="client_handling"?"בטיפול הלקוח":"הוגשה הסבה",msg:null};
  if(t.status==="dispute")return {k:"dispute",label:"במחלוקת",msg:null};
  if(t.status==="ours")return {k:"ours",label:"של המגרש",msg:null};
  if(tab==="expired")return {k:"late",label:"עבר תוקף",msg:null,d};
  if(t.doubledAt){
    if(d===null)return {k:"wait",label:"הוכפל",msg:null,d};
    if(d<=1)return {k:"red",label:"הוכפל – יום לפני",msg:sent.x1?null:"x1",d};
    if(d<=3)return {k:"r3",label:"הוכפל – 3 ימים",msg:sent.x3?null:"x3",d};
    if(d<=5)return {k:"r5",label:"הוכפל – 5 ימים",msg:sent.x5?null:"x5",d};
    return {k:"wait",label:"הוכפל",msg:null,d};
  }
  if(t.source==="binder"){
    if(d===null)return {k:"wait",label:"פתוח",msg:null,d};
    if(d<=2)return {k:"r3",label:"קלסר – יומיים לפני",msg:sent.b2?null:"b2",d};
    if(d<=7)return {k:"r5",label:"קלסר – שבוע לפני",msg:sent.b7?null:"b7",d};
    return {k:"wait",label:"פתוח",msg:null,d};
  }
  const check=d===2||d===0;
  if(d===null)return {k:"new",label:"חסר מועד",msg:sent.intake?null:"intake",d};
  if(d<=1)return {k:"red",label:"דגל אדום",msg:sent.r1?null:"r1",d,check};
  if(d<=3)return {k:"r3",label:"תזכורת שנייה",msg:sent.r3?null:"r3",d,check};
  if(d<=5)return {k:"r5",label:"תזכורת ראשונה",msg:sent.r5?null:"r5",d};
  return {k:sent.intake?"wait":"new",label:sent.intake?"ממתין":"נקלט – לשלוח הודעה",msg:sent.intake?null:"intake",d};
}

function needsAction(t){if(tabOf(t)!=="open")return false;const s=stage(t);return !!(s.msg||s.check||s.k==="red")}

async function message(t,kind){

  if(error)throw error;return data||"";
}

const B=(act,label,cls)=>`<button class="btn small ${cls||""}" data-act="${act}" type="button">${label}</button>`;
function card(t){
  if(t.reviewNeeded)return reviewCard(t);
  const s=stage(t), dl=dealerOf(t), tab=tabOf(t), d=daysTo(deadline(t));
  const isBinder=t.source==="binder";
  const daysTxt=(tab==="open"||tab==="expired")&&d!==null?(d<0?`<span class="days" style="color:var(--red)">עבר לפני ${-d} ימים</span>`:d===0?`<span class="days" style="color:var(--red)">היום!</span>`:`<span class="days">${d} ימים ${t.doubledAt?"למועד":"לכפל"}</span>`):"";
  let note="";
  if(tab==="open"&&s.k==="red")note+=`<div class="note red">דגל אדום: מומלץ להתקשר עכשיו ל${esc(dl.name||"סוחר")}${dl.phone?` – <span dir="ltr">${esc(dl.phone)}</span>`:""}</div>`;
  if(tab==="expired")note+=`<div class="note red">${t.doubledAt?"גם המועד החדש עבר.":"מועד הכפל עבר."} צריך לבדוק אם הדוח שולם.</div>`;
  if(transferLate(t))note+=`<div class="note red">עבר התאריך: מועד הכפל (${fmt(t.doubleDate||t.dueDate)}) עבר וההסבה עוד לא נסגרה.</div>`;
  if(s.check&&tab==="open")note+=`<div class="note amber">היום בודקים אם הדוח שולם.</div>`;
  if(t.clientHandling&&tab!=="archive")note+=`<div class="note amber">בטיפול הלקוח</div>`;
  if(t.offenseDate&&t.saleDate&&t.offenseDate<t.saleDate&&t.status!=="ours")note+=`<div class="note amber">שימו לב: העבירה (${fmt(t.offenseDate)}) קרתה לפני המכירה (${fmt(t.saleDate)}). כנראה שהדוח שייך למגרש.</div>`;
  if(t.notes)note+=`<div class="note">${esc(t.notes)}</div>`;
  if(t.binderNote)note+=`<div class="note">מהקלסר: ${esc(t.binderNote)}</div>`;
  if(t.lastAction)note+=`<div class="sub">${esc(t.lastAction)}</div>`;
  const sentList=Object.keys(MSG_NAME).filter(k=>t.sent[k]).map(k=>`${MSG_NAME[k]} ${fmt(t.sent[k])}`).join(" · ");
  const delList=Object.keys(MSG_NAME).filter(k=>t.delivered[k]).map(k=>`${MSG_NAME[k]} ${fmt(t.delivered[k])}`).join(" · ");
  const noLink=!t.payLink&&!(state.issuers[t.issuerId]||{}).pay_link;
  if(noLink&&tab==="open"&&!isBinder)note+=`<div class="note amber">חסר קישור לתשלום. צריך להשלים בעריכה (או בהגדרות של הגורם) לפני שליחה.</div>`;
  // buttons per tab
  const toLegal=B("legal","טיפול משפטי","ghost"), toLot=B("lotpaid","שולם ע\"י מיליון","ghost");
  let acts="";
  if(tab==="open"){
    if(s.msg)acts+=`<button class="btn wa" data-act="msg" data-kind="${s.msg}" type="button">${MSG_NAME[s.msg]}</button>`;
    else if(!t.doubledAt||t.newDeadline)acts+=`<button class="btn small" data-act="msg" data-kind="${t.doubledAt?"x5":isBinder?"b7":(d!==null&&d<=1)?"r1":"r5"}" type="button">הודעה נוספת</button>`;
    acts+=B("paid","שולם ✓");
    if(t.doubledAt)acts+=B("deadline","עדכון מועד אחרון");
    else acts+=B("transfer","הוגשה הסבה");
    acts+=toLot+toLegal;
  }else if(tab==="expired"){
    acts+=B("paid","שולם ✓","primary");
    if(!t.doubledAt)acts+=B("doubled","הוכפל");
    acts+=toLot+toLegal;
  }else if(tab==="transfer"){
    acts+=B("transferok","הסבה התקבלה","primary")+B("transferno","הסבה נדחתה")+toLot+toLegal;
  }else if(tab==="legal"){
    acts+=B("legaldone","הטיפול הסתיים","primary")+toLot;
  }else if(tab==="lotpaid"){
    acts+=B("lotdone","טופל","primary")+toLegal;
  }else{
    acts+=B("reopen","פתח מחדש","ghost");
  }
  if(t.payLink&&(tab==="open"||tab==="expired"))acts+=`<a class="btn small" href="${esc(t.payLink)}" target="_blank" rel="noopener">בדיקה באתר</a>`;
  acts+=B("edit","עריכה","ghost");

  const dateTxt=t.doubledAt?(t.newDeadline?`<span>מועד חדש <b>${fmt(t.newDeadline)}</b></span>`:`<span>הוכפל ב־<b>${fmt((t.doubledAt||"").slice(0,10))}</b></span>`):`<span>כפל ב־<b>${fmt(t.doubleDate||t.dueDate)}</b></span>`;
  return `<article class="card s-${s.k}" data-id="${esc(t.id)}">
   <div class="row between">${isBinder&&!t.plate?`<span class="binder">קלסר · שורה ${esc(t.binderRow)}</span>`:plateHTML(t.plate)}<span class="row" style="gap:6px">${isBinder&&t.plate?`<span class="binder">קלסר</span>`:""}${t.isSample?`<span class="sample">לדוגמה</span>`:""}${t.doubledAt&&tab!=="archive"?`<span class="pill p-red">הוכפל</span>`:""}<span class="pill p-${s.k}">${esc(s.label)}</span></span></div>
   <div class="row between"><div class="who">${esc(t.dealer||"לא שויך")}</div>${daysTxt}</div>
   <div class="meta">${t.issuer?`<span>${esc(t.issuer)}</span>`:""}${amt}${dateTxt}${t.saleDate?`<span>נמכר <b>${fmt(t.saleDate)}</b></span>`:""}<span>התקבל <b>${fmt(t.receivedDate)}</b></span></div>
   ${delList?`<div class="sub">נמסר לאינסט: ${esc(delList)}</div>`:""}
   ${sentList?`<div class="sub">נשלח לסוחר: ${esc(sentList)}</div>`:""}
   ${note}
   <div class="actions">${acts}</div></article>`;
}
function stats(){
  const open=state.tickets.filter(t=>tabOf(t)==="open");
  const red=open.filter(t=>stage(t).k==="red");
  const sum=open.reduce((a,t)=>a+debt(t),0);
  const m=todayISO().slice(0,7);
  const closedM=state.tickets.filter(t=>ARCHIVE.includes(t.status)&&(t.closedAt||"").startsWith(m)).length;
  const transfers=state.tickets.filter(t=>tabOf(t)==="transfer").length;
  return `<div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px">
   <div><div class="sub">דוחות פתוחים כרגע</div><div style="font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums">${open.length}</div></div>
   <div style="text-align:left"><div class="sub">סכום פתוח</div><div style="font-family:var(--f-display);font-weight:700;font-size:22px">${money(sum)}</div></div></div>

   <div class="stat"><b>${open.length-red.length}</b><span>בתהליך תזכורות</span></div>

   <div class="stat"><b>${closedM}</b><span>נסגרו החודש</span></div></div>`;
}

// ---- summary screen (display only), by the tabs: open | expired | paid by Million | archive.
// Debt of a doubled ticket = amount after doubling. "Paid by Million" counts as owed (owner's decision 08/11/2026).
function viewSummary(){
  if(!state.ready)return `<div class="empty">טוען…</div>`;
  const sum=l=>l.reduce((a,t)=>a+debt(t),0);
  const open=state.tickets.filter(t=>tabOf(t)==="open");
  const week=open.filter(t=>{const d=daysTo(deadline(t));return d!==null&&d>=0&&d<=7});
  const late=state.tickets.filter(t=>tabOf(t)==="expired");
  const m=todayISO().slice(0,7);
  const closed=state.tickets.filter(t=>ARCHIVE.includes(t.status)&&(t.closedAt||"").startsWith(m));
  const lotPaid=state.tickets.filter(t=>tabOf(t)==="lotpaid");
  const by=new Map();
  const add=(t,isOpen)=>{const k=String(t.dealerId||"");const r=by.get(k)||{id:k,name:t.dealer||"לא שויך",n:0,s:0};if(isOpen)r.n++;r.s+=debt(t);by.set(k,r)};
  open.forEach(t=>add(t,true));late.forEach(t=>add(t,true));lotPaid.forEach(t=>add(t,false));
  const rows=[...by.values()].sort((a,b)=>b.s-a.s||b.n-a.n);
  const shown=state.sumAll?rows:rows.slice(0,5);
  const tile=(label,big,small,cls)=>`<div class="stat ${cls||""}"><b>${big}</b><span>${label}${small?`<br>${small}`:""}</span></div>`;
  return `<h2>סיכום</h2>
   <div class="stats sum5">
    ${tile("דוחות פתוחים",open.length)}
    ${tile("שבוע אחרון לתשלום",week.length,money(sum(week)))}
    ${tile("עבר תוקף",late.length,money(sum(late)),late.length?"alert":"")}
    ${tile("נסגרו החודש",closed.length)}
    ${tile("סה״כ חייבים",money(sum(open)+sum(late)+sum(lotPaid)),lotPaid.length?`כולל ${money(sum(lotPaid))} שולם ע"י מיליון`:"")}
   </div>
   <h2>לפי סוחר <span class="count">${rows.length}</span></h2>
   ${rows.length?`<div class="panel" style="padding:4px 14px"><table class="dtab"><thead><tr><th>סוחר</th><th>פתוחים + עבר תוקף</th><th>חוב</th></tr></thead><tbody>
    ${shown.map(r=>`<tr data-dealer="${esc(r.id)}" tabindex="0" role="link"><td>${esc(r.name)}</td><td>${r.n}</td><td>${money(r.s)}</td></tr>`).join("")}
    </tbody></table>
    ${rows.length>5?`<div style="padding:10px 0"><button class="btn small ghost" id="sumAll" type="button">${state.sumAll?"הצג פחות":`הצג הכול (${rows.length})`}</button></div>`:""}</div>`
    :`<div class="empty">אין דוחות פתוחים.</div>`}`;
}

let matchTimer,matchSeq=0;
function showMatch(){clearTimeout(matchTimer);matchTimer=setTimeout(doMatch,250)}
async function doMatch(){
  const box=$("#matchBox");if(!box)return;const p=normPlate($("#f_plate").value);const off=$("#f_off").value;
  if(p.length<7){box.innerHTML="";state.match=null;state.matchFor="";return}
  const key=p+"|"+off;if(key===state.matchFor&&box.innerHTML)return;
  const seq=++matchSeq;box.innerHTML=`<div class="match ok">מחפש…</div>`;
  let m;try{m=await findSale(p,off)}catch(e){box.innerHTML=`<div class="match warn">החיפוש נכשל: ${esc(errText(e))}</div>`;return}
  if(seq!==matchSeq)return;
  state.match=m;state.matchFor=key;
  if(m){
    box.innerHTML=`<div class="match ${m.before?"warn":"ok"}">נמכר ל<b>${esc(m.buyer)}</b> בתאריך ${fmt(m.sale_date)}${m.model?` · ${esc(m.model)}`:""}${m.sales>1?`<br>הרכב נמכר ${m.sales} פעמים. נבחר מי שהחזיק בו ביום העבירה.`:""}${m.before?"<br>העבירה קרתה לפני המכירה – כנראה שהדוח שלנו.":""}${!off?"<br><small>הזינו תאריך עבירה כדי לוודא את השיוך.</small>":""}</div>`;
  }else{
    box.innerHTML=`<div class="match miss"><b>לא נמצא לקוח רשום לרכב מספר ${esc(plateFmt(p))}. מי הלקוח?</b>
     <div class="grid2" style="margin-top:8px"><div class="field"><label for="o_name">שם הקונה / הסוחר</label><input id="o_name" list="dealerList" value="${esc(state.editing?.instCustomer||"")}"></div>
     <div class="field"><label for="o_date">תאריך מכירה</label><input id="o_date" type="date" value="${esc(state.editing?.instSaleDate||"")}"></div></div>
     <datalist id="dealerList">${Object.values(state.dealers).map(d=>`<option value="${esc(d.name)}">`).join("")}</datalist>
     <small>התשובה תישמר לרכב הזה לפעם הבאה.</small></div>`;
  }
}

// a flow step: update the ticket and record who did it and when

    transfer:  [`לסמן שהוגשה הסבה לדוח ${who}? הוא יעבור ללשונית "הסבות".`,"כן, הוגשה הסבה",{status:"pending_transfer"},"עבר להסבות"],
    transferok:[`ההסבה התקבלה? הדוח יעבור לארכיון.`,"כן, התקבלה",{status:"done",closed_at:now()},"עבר לארכיון"],
    transferno:[`ההסבה נדחתה? הדוח יחזור להיות פתוח${daysTo(t.doubleDate||t.dueDate)<0?' (ומכיוון שהמועד עבר – ל"עבר תוקף")':""}.`,"כן, נדחתה",{status:"open",client_handling:false},"הדוח חזר להיות פתוח"],
    legal:     [`להעביר את הדוח ${who} לטיפול משפטי? לא יישלחו עליו תזכורות.`,"העבר לטיפול משפטי",{status:"legal"},"עבר לטיפול משפטי"],
    lotpaid:   [`לסמן שמיליון שילמה את הדוח ${who}? הוא יעבור ל"שולם ע\"י מיליון" והלקוח יישאר חייב.`,"כן, שולם ע\"י מיליון",{status:"lot_paid"},"עבר לשולם ע\"י מיליון"],
    legaldone: [`הטיפול המשפטי הסתיים? הדוח יעבור לארכיון.`,"כן, הסתיים",{status:"done",closed_at:now()},"עבר לארכיון"],
    lotdone:   [`הלקוח החזיר לנו / הטיפול הסתיים? הדוח יעבור לארכיון.`,"כן, טופל",{status:"done",closed_at:now()},"עבר לארכיון"],
    reopen:    [`לפתוח מחדש את הדוח ${who}?`,"פתח מחדש",{status:"open",closed_at:null},"נפתח מחדש"]};
  if(FLOW[act]){const [q,ok,patch,msg]=FLOW[act];confirmSheet(q,ok,async()=>{if(await doAction(t,act,patch))toast(msg)})}
  if(act==="doubled")askSheet(`הדוח ${who} הוכפל`,"הוא יחזור ל\"פתוחים\" עם תווית \"הוכפל\", בלי מועד, עד שיסומן \"שולם\" או שיעודכן לו מועד אחרון.",
    Number(t.amountAfter)?null:{id:"askAmt",label:"הסכום אחרי הכפל (₪)",type:"text",mode:"decimal",value:""},"כן, הוכפל",async v=>{
      const amt=Number(t.amountAfter)||Number(String(v||"").replace(/[^\d.]/g,""));
      if(!amt)return toast("צריך להקליד את הסכום אחרי הכפל"),false;
      return await doAction(t,"doubled",{doubled_at:now(),amount_after:amt,new_deadline:null},{amount_after:amt})&&(toast("הוכפל – חזר לפתוחים"),true)});
  if(act==="deadline")askSheet(`עדכון מועד אחרון – ${who}`,"מהמועד הזה הדוח מתנהג כרגיל: תזכורות לפניו, ו\"עבר תוקף\" אחריו.",
    {id:"askDate",label:"מועד אחרון לתשלום",type:"date",value:t.newDeadline||""},"שמירה",async v=>{
      if(!v)return toast("צריך לבחור תאריך"),false;
      return await doAction(t,"deadline",{new_deadline:v},{new_deadline:v})&&(toast("המועד עודכן"),true)});
  if(act==="edit"){state.editing=t;state.tab="add";render();window.scrollTo(0,0)}
});
document.addEventListener("keydown",e=>{const dr=e.target.closest?.("tr[data-dealer]");if(dr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();dr.click()}});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){state.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==="f_plate"||e.target.id==="f_off")showMatch();
});
document.addEventListener("change",e=>{
  if(e.target.id==="custSel"){state.customer=e.target.value;render();return}
  if(e.target.id==="srcSel"){state.source=e.target.value;render();return}
  if(e.target.id==="f_issuer"){const l=$("#f_link");const urls=Object.values(state.issuers).map(i=>i.pay_link||"");
    if(!l.value||urls.includes(l.value))l.value=(state.issuers[e.target.value]||{}).pay_link||""}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginForm"){const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error)toast(error.message==="Invalid login credentials"?"מייל או סיסמה שגויים":"הכניסה נכשלה: "+errText(error));return}
  if(f.id==="pwForm"){const p1=$("#pw1").value,p2=$("#pw2").value;
    if(p1.length<8)return toast("הסיסמה קצרה מדי");if(p1!==p2)return toast("הסיסמאות לא זהות");
    const {error}=await sb.auth.updateUser({password:p1});if(error)return toast("השמירה נכשלה: "+errText(error));
    history.replaceState(null,"",location.pathname);state.mode="app";toast("הסיסמה נשמרה");await refresh();render();return}
  if(f.dataset.issuer){const fd=new FormData(f);const patch={};for(const k of ["name","pay_link","pay_phone","pay_note"])patch[k]=(fd.get(k)||"").trim()||null;
    if(!patch.name)return toast("חסר שם");
    const {error}=await sb.from("issuers").update(patch).eq("id",f.dataset.issuer);
    if(error)return toast("השמירה נכשלה: "+errText(error));toast("נשמר");await refresh();return}
  if(f.id!=="f"||state.busy)return;
  const plate=normPlate($("#f_plate").value);
  const ed=state.editing;
  if(ed&&ed.source==="binder"&&!plate){  // binder ticket without a car number: save the fields it has, keep its customer
    const num=v=>{const x=Number(String(v).replace(/[^\d.]/g,""));return v&&isFinite(x)?x:null};
    const patch={amount:num($("#f_amt").value),due_date:$("#f_due").value||null,double_date:$("#f_dbl").value||$("#f_due").value||null,
      ticket_no:$("#f_no").value.trim()||null,issuer_id:Number($("#f_issuer").value)||null,pay_link:$("#f_link").value.trim()||null,
      notes:$("#f_notes").value.trim()||null,status:$("#f_status")?.value||ed.status,
      client_handling:!!$("#f_client")?.checked,...($("#f_newdl")?{new_deadline:$("#f_newdl").value||null}:{})};
    if(!ARCHIVE.includes(patch.status))patch.closed_at=null;else if(!ARCHIVE.includes(ed.status))patch.closed_at=new Date().toISOString();
    const {error}=await sb.from("tickets").update(patch).eq("id",ed.id);
    if(error)return toast("השמירה נכשלה: "+errText(error));
    toast("הדוח עודכן");state.editing=null;await refresh();go("all");return}
  if(plate.length<7)return toast("מספר רכב לא תקין");
  const off=$("#f_off").value;
  state.busy=true;
  try{
    if(state.matchFor!==plate+"|"+off){state.matchFor="";await doMatch()}
    let m=state.match;
    if(!m){const n=$("#o_name")?.value.trim(),sd=$("#o_date")?.value;
      if(!n)return toast("צריך לכתוב מי הלקוח של הרכב");if(!sd)return toast("צריך תאריך מכירה");
      const dealer_id=await dealerIdFor(n);
      const {data,error}=await sb.from("car_sales").insert({plate,sale_date:sd,dealer_id,buyer_raw:n,source:"manual"}).select("id,plate,model,sale_date,dealer_id").single();
      if(error)throw error;
      m={...data,buyer:n,before:off?off<sd:false};await load();
    }
    const time=$("#f_time").value;
    const num=v=>{const x=Number(String(v).replace(/[^\d.]/g,""));return v&&isFinite(x)?x:null};
    const data={plate,sale_id:m.id,dealer_id:m.dealer_id,issuer_id:Number($("#f_issuer").value),
      ticket_no:$("#f_no").value.trim()||null,receipt_no:$("#f_rcpt").value.trim()||null,
      offense_at:off?`${off}T${time||"00:00"}:00`:null,offense_place:$("#f_place").value.trim()||null,
      notice_date:$("#f_notice").value||null,amount:num($("#f_amt").value),amount_after:num($("#f_after").value),
      due_date:$("#f_due").value||null,double_date:$("#f_dbl").value||$("#f_due").value||null,
      pay_link:$("#f_link").value.trim()||null,notes:$("#f_notes").value.trim()||null,
      ...($("#f_client")?{client_handling:$("#f_client").checked}:{}),...($("#f_newdl")?{new_deadline:$("#f_newdl").value||null}:{})};
    const id=$("#f_id").value;let error;
    const wasReview=!!(id&&state.editing&&state.editing.reviewNeeded);
    if(wasReview){if(!data.issuer_id)return toast("צריך לבחור גורם מוציא");data.review_needed=false;data.review_reason=null;data.status=m.before?"ours":"open"}
    else if(id&&$("#f_status")){data.status=$("#f_status").value;
      if(!ARCHIVE.includes(data.status))data.closed_at=null;else if(ed&&!ARCHIVE.includes(ed.status))data.closed_at=new Date().toISOString()}
    if(id)({error}=await sb.from("tickets").update(data).eq("id",id));
    else({error}=await sb.from("tickets").insert({...data,status:m.before?"ours":"open",created_by:state.user.id}));
    if(error)throw error;
    toast(wasReview?"הדוח אושר ונכנס לתהליך":id?"הדוח עודכן":"הדוח נשמר");state.editing=null;await refresh();go("today");
  }catch(err){toast("השמירה נכשלה: "+errText(err))}
  finally{state.busy=false}
});

// ---- export (CSV to clipboard, opens in Google Sheets)
$("#exportBtn").onclick=async()=>{
  const cols=[["plate","מספר רכב"],["dealer","נמכר ל"],["saleDate","תאריך מכירה"],["issuer","גורם"],["ticketNo","מספר דוח"],["offenseDate","תאריך עבירה"],["receivedDate","התקבל"],["amount","סכום"],["dueDate","לתשלום עד"],["doubleDate","מועד כפל"],["status","סטטוס"],["notes","הערות"]];
  const ST={open:"פתוח",paid:"שולם",dispute:"מחלוקת",ours:"של המגרש",...OTHER_STATUS};
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[cols.map(c=>q(c[1])).join(","),...state.tickets.map(t=>cols.map(([k])=>q(k==="status"?ST[t.status]||t.status:t[k])).join(","))].join("\n");
  try{await navigator.clipboard.writeText(csv);toast("הועתק. הדביקו ב־Google Sheets")}catch(err){toast("ההעתקה לא הצליחה")}
};

// ---- boot
$("#today").textContent=new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
if(/type=(invite|recovery)/.test(START_HASH))state.mode="setpw";
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY")state.mode="setpw";
  const was=state.user?.id;state.user=session?.user||null;
  if(!state.user){state.ready=false;state.tickets=[];$("#conn").textContent="";if(state.mode!=="setpw")state.mode="login";render();return}
  if(state.mode==="login")state.mode="app";
  if(was!==state.user.id)setTimeout(async()=>{render();await refresh();render()},0);
});
setInterval(refresh,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
})();
</script>
</body>
</html>
